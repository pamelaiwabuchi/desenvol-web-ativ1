<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="font-['Google_Sans'] bg-white min-h-screen">
    <nav class="font-bold flex flex-col md:flex-row md:flex-wrap justify-center items-center gap-2 md:gap-12 bg-rose-950 p-4 w-full">
        <a href="../index.html" class="text-white hover:underline text-sm md:text-base">Home</a>
        <a href="../1-frete-e-relatorio/index.html" class="text-white hover:underline text-sm md:text-base">Frete</a>
        <a href="../2-folha-pagamento-e-bonus/index.html" class="text-white hover:underline text-sm md:text-base">Folha de Pagamento</a>
        <a href="../3-controle-producao-estoque-e-relatorios/index.html" class="text-white hover:underline text-sm md:text-base">Controle de Produção e Estoque</a>
        <a href="#" class="text-white hover:underline text-sm md:text-base">Reserva de Hotel</a>
        <a href="../5-treinos-esportivos/index.html" class="text-white hover:underline text-sm md:text-base">Treinos Esportivos</a>
        <a href="../6-vendas-comissoes/index.html" class="text-white hover:underline text-sm md:text-base">Vendas e Comissões</a>
    </nav>

    <div class="flex justify-center items-center px-4 py-8 md:py-12">
        <div class="container bg-rose-900 rounded-2xl md:rounded-3xl p-6 md:p-10 w-full max-w-2xl flex flex-col gap-4">
            <h1 class="text-white text-2xl md:text-3xl font-bold text-center mb-2">Reserva de Hotéis</h1>

            <div class="campo flex flex-col gap-1">
                <label for="valorBaseDiaria" class="text-white text-base md:text-lg">Valor Base da Diária Padrão:</label>
                <input type="number" id="valorBaseDiaria" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="valorCafe" class="text-white text-base md:text-lg">Valor Café da Manhã por hóspede:</label>
                <input type="number" id="valorCafe" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="codigoReserva" class="text-white text-base md:text-lg">Código de Reserva</label>
                <input type="number" id="codigoReserva" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="tipoQuarto" class="text-white text-base md:text-lg">Tipo de quarto (S–Standard, L–Luxo, P–Premium)</label>
                <select id="tipoQuarto" required class="text-gray-500 rounded-md px-3 py-2 w-full">
                    <option value="" disabled selected>Selecione o Tipo de Quarto</option>
                    <option value="S">S–Standard</option>
                    <option value="L">L–Luxo</option>
                    <option value="P">P–Premium</option>
                </select>
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="temporada" class="text-white text-base md:text-lg">Temporada (B–Baixa, A–Alta, F–Feriado)</label>
                <select id="temporada" required class="text-gray-500 rounded-md px-3 py-2 w-full">
                    <option value="" disabled selected>Selecione a Temporada</option>
                    <option value="B">B–Baixa</option>
                    <option value="A">A–Alta</option>
                    <option value="F">F–Feriado</option>
                </select>
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="qtdeDiarias" class="text-white text-base md:text-lg">Quantidade de diárias:</label>
                <input type="number" id="qtdeDiarias" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="numHospedes" class="text-white text-base md:text-lg">Número de hóspedes</label>
                <input type="number" id="numHospedes" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="cafeIncluso" class="text-white text-base md:text-lg">Café da manhã incluso? (S/N)</label>
                <select id="cafeIncluso" required class="text-gray-500 rounded-md px-3 py-2 w-full">
                    <option value="" disabled selected>Selecione</option>
                    <option value="S">Sim</option>
                    <option value="N">Não</option>
                </select>
            </div>
            <div class="botoes flex flex-col sm:flex-row gap-3 mt-2">
                <button onclick="adicionarReserva()" class="bg-white text-rose-950 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 text-sm md:text-base">Adicionar Reserva</button>
                <button onclick="gerarRelatorio()" class="bg-white text-rose-950 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 text-sm md:text-base">Gerar Relatório</button>
            </div>
            <div id="relatorio" class="text-white"></div>
        </div>
    </div>
</body>
</html>
