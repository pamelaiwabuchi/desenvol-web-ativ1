<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Hotel</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Reserva de Hotéis</h1>
    <div class="campo">
        <label for="valorBaseDiaria">Valor Base da Diária Padrão:</label>
        <input type="number" id="valorBaseDiaria">
    </div>
    <div class="campo">
        <label for="valorCafe">Valor Café da Manhã por hóspede:</label>
        <input type="number" id="valorCafe">
    </div>
    <div class="campo">
        <label for="codigoReserva">Código de Reserva</label>
        <input type="number" id="codigoReserva">
    </div>
    <div class="campo">
        <label for="tipoQuarto">Tipo de quarto (S–Standard, L–Luxo, P–Premium)</label>
        <select id="tipoQuarto" required>
            <option value="" disabled selected>Selecione o Tipo de Quarto</option>
            <option value="S">S–Standard</option>
            <option value="L">L–Luxo</option>
            <option value="P">P–Premium</option>
        </select>
    </div>
    <div class="campo">
        <label for="temporada">Temporada (B–Baixa, A–Alta, F–Feriado)</label>
        <select id="temporada" required>
            <option value="" disabled selected>Selecione a Temporada</option>
            <option value="B">B–Baixa</option>
            <option value="A">A–Alta</option>
            <option value="F">F–Feriado</option>
        </select>
    </div>
    <div class="campo">
        <label for="qtdeDiarias">Quantidade de diárias:</label>
        <input type="number" id="qtdeDiarias">
    </div>
    <div class="campo">
        <label for="numHospedes">Número de hóspedes</label>
        <input type="number" id="numHospedes">
    </div>
    <div class="campo">
        <label for="cafeIncluso">Café da manhã incluso? (S/N)</label>
        <select id="cafeIncluso" required>
            <option value="" disabled selected>Selecione</option>
            <option value="S">Sim</option>
            <option value="N">Não</option>
        </select>
    </div>
    <div>
        <button onclick="adicionarReserva()">Adicionar Reserva</button>
        <button onclick="gerarRelatorio()">Gerar Relatório</button>
    </div>
    <div id="relatorio"></div>
</body>
