</head>

    <h1>Sistema de Controle de Produção com Estoque e Relatórios</h1>
    <div class="campo">
        <label for="codigoOrdem">Código da ordem:</label>
        <input type="number" id="codigoOrdem">
    </div>
    <div class="campo">
        <label for="codigoProduto">Código do produto:</label>
        <input type="number" id="codigoProduto">
    </div>
    <div class="campo">
        <label for="tipo">Tipo de Produto (1-Padrão, 2-Premium, 3-Sob encomenda)</label>
        <input type="number" id="tipo">
    </div>
    <div class="campo">
        <label for="qtdeProduzida">Quantidade produzida:</label>
        <input type="number" id="qtdeProduzida">
    </div>
    <div class="campo">
        <label for="custoUnit">Custo Unitário de Produção:</label>
        <input type="number" id="custoUnit">
    </div>
    <div>
        <label for="estoqueInicial">Estoque Inicial do Produto:</label>
        <input type="number" id="estoqueInicial">
    </div>
    <div>
        <button onclick="adicionarOrdem()">Adicionar Ordem de Produção</button>
        <button onclick="gerarRelatorio()">Gerar Relatório</button>
    </div>
    <div id="relatorio"></div>
    
</body>
</html>
