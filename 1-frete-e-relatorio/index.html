<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frete e relatório</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="font-['Google_Sans'] bg-white min-h-screen">

    <nav class="flex flex-col md:flex-row md:flex-wrap justify-center items-center gap-2 md:gap-12 bg-rose-950 p-4 w-full">
        <a href="../index.html" class="text-white hover:underline text-sm md:text-base">Home</a>
        <a href="#" class="text-white hover:underline text-sm md:text-base">Frete</a>
        <a href="../2-folha-pagamento-e-bonus/index.html" class="text-white hover:underline text-sm md:text-base">Folha de Pagamento</a>
        <a href="../3-controle-producao-estoque-e-relatorios/index.html" class="text-white hover:underline text-sm md:text-base">Controle de Produção e Estoque</a>
        <a href="../4-reserva-hotel-tarifas/index.html" class="text-white hover:underline text-sm md:text-base">Reserva de Hotel</a>
        <a href="../5-treinos-esportivos/index.html" class="text-white hover:underline text-sm md:text-base">Treinos Esportivos</a>
        <a href="../6-vendas-comissoes/index.html" class="text-white hover:underline text-sm md:text-base">Vendas e Comissões</a>
    </nav>

    <div class="flex justify-center items-center px-4 py-8 md:py-12">
        
        <div class="container bg-emerald-700 rounded-2xl md:rounded-3xl p-6 md:p-10 w-full max-w-2xl flex flex-col gap-4">
            <h1 class="text-white text-2xl md:text-3xl font-bold text-center mb-2">Cálculo de Frete</h1>
            <div class="campo flex flex-col gap-1">
                <label for="combustivel" class="text-white text-base md:text-lg">Qual o preço do combustível hoje?</label>
                <input type="number" id="combustivel" placeholder="Digite o valor aqui" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="codigo" class="text-white text-base md:text-lg">Código do pedido:</label>
                <input type="number" id="codigo" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="regiao" class="text-white text-base md:text-lg">Digite sua região (1, 2 ou 3)</label>
                <input type="text" id="regiao" class="text-gray-500 rounded-md px-3 py-2 w-full">
                <!-- <select id="regiao">
                    <option value="">Selecione...</option>
                    <option value="1">Região 1 - Sudeste</option>
                    <option value="2">Região 2 - Sul</option>
                    <option value="3">Região 3 - Centro-Oeste</option>
                </select> -->
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="distancia" class="text-white text-base md:text-lg">Distância em Km:</label>
                <input type="number" id="distancia" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="quantidade" class="text-white text-base md:text-lg">Quantidade de peças:</label>
                <input type="number" id="quantidade" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo campo-radio flex flex-col gap-2">
                <p class="text-white text-base md:text-lg">Aceita Rastreamento?</p>
                <div class="flex items-center gap-2">
                    <label for="sim" class="text-white text-base md:text-lg">Sim</label>
                    <input type="radio" id="sim" name="rastreamento" required>
                    <label for="nao" class="text-white text-base md:text-lg">Não</label>
                    <input type="radio" id="nao" name="rastreamento" required>
                </div>
            </div>
            <div class="botoes flex flex-col sm:flex-row gap-3 mt-2">
                <button type="button" onclick="adicionarPedido()" class="bg-white text-emerald-800 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 text-sm md:text-base">Adicionar mais pedidos</button>
                <button type="button" onclick="gerarRelatorio()" class="bg-white text-emerald-800 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 text-sm md:text-base">Encerrar e Gerar Relatório</button>
            </div>
            <div id="relatorio" class="text-white"></div>
        </div>
    </div>
</body>
</html>
