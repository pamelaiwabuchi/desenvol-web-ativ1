<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="campo">
            <label for="combustivel">Qual o preço do combustível hoje?</label>
            <input type="number" id="combustivel" placeholder="Digite o valor aqui">
        </div>
        <div class="campo">
            <label for="codigo">Código do pedido:</label>
            <input type="number" id="codigo">
        </div>
        <div class="campo">
            <label for="regiao">Digite sua região (1, 2 ou 3)</label>
            <input type="text" id="regiao">
            <!-- <select id="regiao">
                <option value="">Selecione...</option>
                <option value="1">Região 1 - Sudeste</option>
                <option value="2">Região 2 - Sul</option>
                <option value="3">Região 3 - Centro-Oeste</option>
            </select> -->
        </div>
        <div class="campo">
            <label for="distancia">Distância em Km:</label>
            <input type="number" id="distancia">
        </div>
        <div class="campo">
            <label for="quantidade">Quantidade de peças:</label>
            <input type="number" id="quantidade">
        </div>
        <div class="campo campo-radio">
            <p>Aceita Rastreamento?</p>
            <label for="sim">Sim</label>
            <input type="radio" id="sim" name="rastreamento" required>
            <label for="nao">Não</label>
            <input type="radio" id="nao" name="rastreamento" required>
        </div>
        <div class="botoes">
            <button type="button" onclick="adicionarPedido()">Adicionar mais pedidos</button>
            <button type="button" onclick="gerarRelatorio()">Encerrar e Gerar Relatório</button>
        </div>
        <div id="relatorio">    </div>
    </div>
</body>
</html>
