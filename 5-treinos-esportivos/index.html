<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos Esportivos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="font-['Google_Sans'] bg-white min-h-screen">
    <nav class="flex flex-col md:flex-row md:flex-wrap justify-center items-center gap-2 md:gap-12 bg-neutral-800 p-4 w-full">
        <a href="../index.html" class="text-white hover:underline text-sm md:text-base">Home</a>
        <a href="../1-frete-e-relatorio/index.html" class="text-white hover:underline text-sm md:text-base">Frete</a>
        <a href="../2-folha-pagamento-e-bonus/index.html" class="text-white hover:underline text-sm md:text-base">Folha de Pagamento</a>
        <a href="../3-controle-producao-estoque-e-relatorios/index.html" class="text-white hover:underline text-sm md:text-base">Controle de Produção e Estoque</a>
        <a href="../4-reserva-hotel-tarifas/index.html" class="text-white hover:underline text-sm md:text-base">Reserva de Hotel</a>
        <a href="#" class="text-white hover:underline text-sm md:text-base">Treinos Esportivos</a>
        <a href="../6-vendas-comissoes/index.html" class="text-white hover:underline text-sm md:text-base">Vendas e Comissões</a>
    </nav>

    <div class="flex justify-center items-center px-4 py-8 md:py-12">
        <div class="font-bold container bg-green-900 rounded-2xl md:rounded-3xl p-6 md:p-10 w-full max-w-2xl flex flex-col gap-4">
            <h1 class="text-white text-2xl md:text-3xl font-bold text-center mb-2">Treinos Esportivos Semanais</h1>

            <div class="campo flex flex-col gap-1">
                <label for="cargaRecomendada" class="text-white text-base md:text-lg">Carga máxima semanal recomendada:</label>
                <input type="number" id="cargaRecomendada" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="flex flex-col gap-1">
                <label for="codigoTreino" class="text-white text-base md:text-lg">Código de Treino:</label>
                <input type="number" id="codigoTreino" required class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="nome" class="text-white text-base md:text-lg">Nome do Jogador:</label>
                <input type="text" id="nome" class="text-gray-500 rounded-md px-3 py-2 w-full">  
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="posicao" class="text-white text-base md:text-lg">Posicao:</label>
                <select id="posicao" required class="text-gray-500 rounded-md px-3 py-2 w-full">
                    <option value="" disabled selected>Selecione a posição</option>
                    <option value="goleiro">Goleiro</option>
                    <option value="zagueiro">Zagueiro</option>
                    <option value="meioCampo">Meio-campo</option>
                    <option value="atacante">Atacante</option>
                </select>
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="tipoTreino" class="text-white text-base md:text-lg">Tipo de treino:</label>
                <select id="tipoTreino" required class="text-gray-500 rounded-md px-3 py-2 w-full">
                    <option value="" disabled selected>Selecione o treino:</option>
                    <option value="fisico">Físico</option>
                    <option value="tecnico">Técnico</option>
                    <option value="estrategico">Estratégico</option>
                </select>
            </div>
            <div class="campo flex flex-col gap-1">
                <label for="duracao" class="text-white text-base md:text-lg">Duração em minutos:</label>
                <input type="number" id="duracao" class="text-gray-500 rounded-md px-3 py-2 w-full">  
            </div>
            <div class="flex flex-col gap-1">
                <label for="intensidade" class="text-white text-base md:text-lg">Intensidade (1 a 10)</label>
                <input type="number" id="intensidade" class="text-gray-500 rounded-md px-3 py-2 w-full">
            </div> 
            <div class="botoes flex flex-col sm:flex-row gap-3 mt-2">
                <button onclick="adicionarTreino()" class="bg-white text-green-900 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 text-sm md:text-base">Adicionar Treino</button>
                <button onclick="gerarRelatorio()" class="bg-white text-green-900 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 text-sm md:text-base">Encerrar e Gerar Relatório</button>
            </div>
            <div id="relatorio" class="text-white"></div>
        </div>
    </div>
</body>
</html>
