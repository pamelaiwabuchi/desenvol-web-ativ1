<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos Esportivos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <nav class="flex flex-col md:flex-row md:flex-wrap justify-center items-center gap-2 md:gap-12 bg-emerald-800 p-4 w-full">
        <a href="/index.html" class="text-white hover:underline text-sm md:text-base">Home</a>
        <a href="/1-frete-e-relatorio/index.html" class="text-white hover:underline text-sm md:text-base">Frete</a>
        <a href="/2-folha-pagamento-e-bonus/index.htm" class="text-white hover:underline text-sm md:text-base">Folha de Pagamento</a>
        <a href="/3-controle-producao-estoque-e-relatorios/index.html" class="text-white hover:underline text-sm md:text-base">Controle de Produção e Estoque</a>
        <a href="/4-reserva-hotel-tarifas/index.html" class="text-white hover:underline text-sm md:text-base">Reserva de Hotel</a>
        <a href="" class="text-white hover:underline text-sm md:text-base">Treinos Esportivos</a>
        <a href="/6-vendas-comissoes/index.html" class="text-white hover:underline text-sm md:text-base">Vendas e Comissões</a>
    </nav>
    <h1>Treinos Esportivos Semanais</h1>
    <div class="campo">
        <label for="cargaRecomendada">Carga máxima semanal recomendada:</label>
        <input type="number" id="cargaRecomendada">
    </div>
    <div>
        <label for="codigoTreino">Código de Treino:</label>
        <input type="number" id="codigoTreino" required>
    </div>
    <div class="campo">
        <label for="nome">Nome do Jogador:</label>
        <input type="text" id="nome">  
    </div>
    <div class="campo">
        <label for="posicao">Posicao:</label>
        <select id="posicao" required>
            <option value="" disabled selected>Selecione a posição</option>
            <option value="goleiro">Goleiro</option>
            <option value="zagueiro">Zagueiro</option>
            <option value="meioCampo">Meio-campo</option>
            <option value="atacante">Atacante</option>
        </select>
    </div>
    <div class="campo">
        <label for="tipoTreino">Tipo de treino:</label>
            <select id="tipoTreino" required>
                <option value="" disabled selected>Selecione o treino:</option>
                <option value="fisico">Físico</option>
                <option value="tecnico">Técnico</option>
                <option value="estrategico">Estratégico</option>
            </select>
    </div>
    <div class="campo">
        <label for="duracao">Duração em minutos:</label>
        <input type="number" id="duracao">  
    </div>
    <div>
        <label for="intensidade">Intensidade (1 a 10)</label>
        <input type="number" id="intensidade">
    </div> 
    <div>
        <button onclick="adicionarTreino()">Adicionar Treino</button>
        <button onclick="gerarRelatorio()">Encerrar e Gerar Relatório</button>
    </div>
    <div id="relatorio"></div>

</body>
</html>
